name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
      STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || {
            echo "::error::ANDROID_KEYSTORE_BASE64 repository secret is not configured."
            exit 1
          }
          test -n "$STORE_PASSWORD" || {
            echo "::error::ANDROID_KEYSTORE_PASSWORD repository secret is not configured."
            exit 1
          }
          test -n "$KEY_PASSWORD" || {
            echo "::error::ANDROID_KEY_PASSWORD repository secret is not configured."
            exit 1
          }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

      - name: Build signed release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: btu-classroom-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
